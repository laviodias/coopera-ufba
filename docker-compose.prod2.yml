services:
  db:
    image: postgres:latest
    networks:
      - nginxproxymanager_default
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: marketplace_db
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: redis_marketplace
    networks:
      - nginxproxymanager_default
    volumes:
      - redis-data:/data
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    networks:
      - nginxproxymanager_default
    depends_on:
      - db
      - redis
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:root@db:5432/marketplace_db
      REDIS_PUBLIC_URL: redis://redis:6379
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    networks:
      - nginxproxymanager_default
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "https://coopera.laviovale.com/api"
      NEXT_PUBLIC_FRONT_END_URL: "https://coopera.laviovale.com"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    networks:
      - nginxproxymanager_default
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ./logs/caddy:/var/log/caddy
    depends_on:
      - api
      - frontend
    restart: unless-stopped

networks:
  nginxproxymanager_default:
    name: nginxproxymanager_default
    external: true

volumes:
  postgres_data:
  redis-data:
  caddy_data:
  caddy_config: